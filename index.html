<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f7f7f7;--fg:#535353;--tint:#ececec;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--fg:#d0d0d0;--tint:#2a2b2e}}
:root[data-theme="dark"]{--bg:#202124;--fg:#d0d0d0;--tint:#2a2b2e}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
#w{position:fixed;inset:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#menu{position:fixed;inset:0;z-index:5;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);font-family:ui-monospace,monospace}
#menu h1{margin:0;font-size:22px}#cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{width:140px;border:2px solid var(--fg);border-radius:16px;padding:14px 10px;background:var(--tint);color:var(--fg);font:bold 18px ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;gap:10px}
.card img{height:110px;max-width:100px;object-fit:contain}
#mb{position:fixed;z-index:3;display:none;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;padding:8px 12px;border:2px solid var(--fg);border-radius:10px;background:var(--bg);color:var(--fg);font:bold 14px ui-monospace,monospace}

const TH={Kunji:{bg:'#fdeff5',tint:'#f8d3e2',fg:'#8c4a6b',acc:'#f2a0c0',k:'g'},Pappu:{bg:'#e8f3ff',tint:'#cde3f8',fg:'#27476b',acc:'#6aa8e4',k:'b'}};
const wrap=(v,l)=>((v%l)+l)%l;
function heart(a,b,s){x.beginPath();x.moveTo(a,b+s*.35);x.bezierCurveTo(a-s,b-s*.3,a-s*.5,b-s,a,b-s*.4);x.bezierCurveTo(a+s*.5,b-s,a+s,b-s*.3,a,b+s*.35);x.fill()}
function star(a,b,r){x.beginPath();for(let i=0;i<10;i++){const g=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;x.lineTo(a+Math.cos(g)*q,b+Math.sin(g)*q)}x.closePath();x.fill()}
let T=TH.Kunji,ac,bufs=[],cur={},menuOpen=true,mbShown=false;
try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
function pick(c){T=TH[c.name]||TH.Kunji;const k=Math.min(74/c.w,66/c.h);PW=c.w*k;PH=c.h*k;face=new Image();face.src='data:image/png;base64,'+c.img;
if(!c.bufs){c.bufs=[];try{c.snd.forEach(b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);ac.decodeAudioData(u.buffer,d=>c.bufs.push(d),()=>{})})}catch(e){}}
bufs=c.bufs}
function play(){try{if(!bufs.length)return;if(cur.s){try{cur.s.stop()}catch(e){}}const s=ac.createBufferSource();s.buffer=bufs[Math.random()*bufs.length|0];s.connect(ac.destination);s.start();cur.s=s}catch(e){}}
const mn=document.getElementById('menu'),cd=document.getElementById('cards'),mb=document.getElementById('mb');
CH.forEach(c=>{const b=document.createElement('button');b.className='card';b.innerHTML='<img src="data:image/png;base64,'+c.img+'"><span>'+c.name+'</span>';
b.onclick=()=>{if(ac&&ac.state!='running')ac.resume();pick(c);menuOpen=false;mn.style.display='none';reset();run=false};cd.appendChild(b)});
mb.onclick=()=>{menuOpen=true;mn.style.display='flex'};
pick(CH[0]);
let z,vz,rot,run,over,sp,sc,hi=0,fr,ob,cl,hold,gx,deadAt=0;
function reset(){z=0;vz=0;rot=0;ob=[];sp=5;sc=0;fr=0;gx=0;over=false;run=true;hold=false;cl=[...Array(6)].map((_,i)=>({x:i*150,y:30+Math.random()*180,s:.6+Math.random()*.8}))}
size();reset();run=false;
function jump(){vz=14.5;play()}
function die(){over=true;deadAt=performance.now();hi=Math.max(hi,sc|0);play()}
function press(){if(menuOpen)return;if(ac&&ac.state!='running')ac.resume();if(over){if(performance.now()-deadAt>350)reset();return}run=true;hold=true;if(z<=0)jump()}
function release(){hold=false}
cv.addEventListener('pointerdown',e=>{e.preventDefault();press()});
addEventListener('pointerup',release);addEventListener('pointercancel',release);
addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='ArrowUp'||e.code=='Enter'){e.preventDefault();if(!e.repeat)press()}});
addEventListener('keyup',e=>{if(e.code=='Space'||e.code=='ArrowUp'||e.code=='Enter')release()});
function spawn(){const l=ob[ob.length-1],gap=sp*40+90+Math.random()*190;if(l&&l.x+l.w>W-gap)return;
const n=1+(Math.random()*(sc>40?3:2)|0),h=42+Math.random()*24;for(let i=0;i<n;i++)ob.push({x:W+30+i*24,w:22,h:h-(i%2)*8})}
function step(){fr++;if(!run||over)return;
sp=Math.min(sp+.0015,10.5);sc+=sp*.014;gx+=sp;
if(hold&&z<=0)jump();
vz-=.72;z+=vz;if(z<=0){z=0;vz=0;rot=0}else rot+=.16;
cl.forEach(c=>{c.x-=sp*.25;if(c.x<-80)c.x=W+60+Math.random()*100});
ob.forEach(o=>o.x-=sp);ob=ob.filter(o=>o.x>-50);spawn();
const cy=GY-PH/2-z,hx=PX-PW*.3,hy=cy-PH*.3,hw=PW*.6,hh=PH*.6;
for(const o of ob)if(hx<o.x+o.w-3&&hx+hw>o.x+3&&hy+hh>GY-o.h+2){die();break}}
function draw(){bg=T.bg;fg=T.fg;tint=T.tint;const sm=!menuOpen&&(!run||over);if(sm!==mbShown){mb.style.display=sm?"block":"none";mbShown=sm}x.setTransform(K,0,0,K,0,0);x.imageSmoothingQuality='high';
x.fillStyle=bg;x.fillRect(0,0,W,H);
x.fillStyle=T.acc;x.globalAlpha=.3;const L=W+400,n=Math.ceil(L/260)+1;
for(let k=0;k<n;k++){const m=wrap(k*260-gx*.12,L)-200;x.beginPath();if(T.k=='g')x.ellipse(m,GY,150,50+(k&1)*20,0,Math.PI,2*Math.PI);else{x.moveTo(m-130,GY);x.lineTo(m,GY-115+(k&1)*40);x.lineTo(m+130,GY)}x.fill()}
if(T.k=='b'){x.globalAlpha=.55;x.beginPath();x.arc(W*.78,GY*.3,26,0,7);x.fill()}
cl.forEach((c,i)=>{if(i%2==0){x.globalAlpha=.85;x.fillStyle='#fff';x.fillRect(c.x,c.y,44*c.s,10*c.s);x.fillRect(c.x+10*c.s,c.y-8*c.s,24*c.s,8*c.s)}else{x.globalAlpha=.8;x.fillStyle=T.acc;const yy=c.y+Math.sin(fr/30+i)*4;if(T.k=='g')heart(c.x,yy,8+4*c.s);else star(c.x,yy,7+4*c.s)}});
x.globalAlpha=1;x.fillStyle=fg;
x.globalAlpha=1;x.fillStyle=tint;x.fillRect(0,GY,W,H-GY);x.fillStyle=fg;x.fillRect(0,GY,W,2);
x.globalAlpha=.35;for(let r=0,n=Math.ceil((H-GY)/18);r<n;r++){const y=GY+14+r*18,sd=1+r*.08,st=60+r*9;for(let q=-((gx*sd)%st);q<W;q+=st)x.fillRect(q,y,10+(r%3)*5,2)}
x.globalAlpha=1;
ob.forEach(o=>{const t=GY-o.h;x.fillRect(o.x+8,t,7,o.h);x.fillRect(o.x,GY-o.h*.62,4,14);x.fillRect(o.x,GY-o.h*.62+10,10,4);x.fillRect(o.x+18,GY-o.h*.78,4,16);x.fillRect(o.x+12,GY-o.h*.78+12,10,4)});
x.globalAlpha=.18;x.beginPath();x.ellipse(PX,GY+3,PW*.4*Math.max(.3,1-z/260),5,0,0,7);x.fill();x.globalAlpha=1;
const bob=run?0:Math.sin(fr/12)*3;
x.save();x.translate(PX,GY-PH/2-z+bob);x.rotate(rot);x.drawImage(face,-PW/2,-PH/2,PW,PH);x.restore();
x.font='bold 18px ui-monospace,monospace';x.textAlign='right';x.fillText((hi?'HI '+String(hi).padStart(5,'0')+'   ':'')+String(sc|0).padStart(5,'0'),W-14,30);
x.textAlign='center';
if(!run){x.font='bold 22px ui-monospace,monospace';x.fillText('TAP TO START',W/2,GY*.38)}
if(over){x.font='bold 24px ui-monospace,monospace';x.fillText('GAME OVER',W/2,GY*.36);x.font='16px ui-monospace,monospace';x.fillText('tap to restart',W/2,GY*.36+28)}}
let acc=0,last=0;
(function loop(t){const dt=Math.min((t-last)/1000,.1);last=t;acc+=dt;while(acc>=1/60){step();acc-=1/60}draw();requestAnimationFrame(loop)})(0);
</script></body></html>
